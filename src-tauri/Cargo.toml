[package]
name = "app"
version = "0.2.1"
description = "Tutor de mecanografia multiplataforma, visual y accesible"
authors = ["Jesus Romeo"]
license = "MIT"
repository = "https://github.com/jrmougan/libretype"
edition = "2021"
# Es el mínimo que declaran tauri 2.12 y todos sus plugins (y el máximo de todo
# el árbol de dependencias): por debajo no compila. Subir solo si alguna lo pide.
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2.10.2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }

# El actualizador solo existe en escritorio: en móvil actualiza la tienda, no
# la app. Se declaran aparte para no arrastrar reqwest ni zip a un build de
# Android, donde además no compilarían.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
