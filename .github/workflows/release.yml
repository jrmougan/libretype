name: Release

# Se dispara al empujar una etiqueta de versión:
#     git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

jobs:
  publicar:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Linux
            runner: ubuntu-22.04
            args: ''
          - nombre: macOS (universal)
            runner: macos-latest
            args: '--target universal-apple-darwin'
          - nombre: Windows
            runner: windows-latest
            args: ''

    steps:
      - uses: actions/checkout@v7

      # La `pubkey` vacía no rompe la compilación ni el arranque: el plugin
      # solo verifica al descargar. Publicar así es la trampa — los binarios
      # saldrían incapaces de validar ninguna actualización futura, y eso no se
      # arregla con una release nueva porque el fallo está en el que ya está
      # instalado. Mejor romper aquí.
      - name: Comprobar que el actualizador está configurado
        shell: bash
        run: |
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey || ''")
          if [ -z "$pubkey" ]; then
            echo "::error::Falta plugins.updater.pubkey en src-tauri/tauri.conf.json."
            echo "Genérala con 'pnpm tauri signer generate -w ~/.tauri/libretype.key'."
            exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY."
            echo "Sin él tauri-action no firma ni genera latest.json."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias del sistema (Linux)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.runner }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma del actualizador (minisign). No tiene nada que ver con firmar
          # el binario para Gatekeeper o SmartScreen: es gratis, no necesita
          # cuenta de Apple ni certificado, y es lo que hace que una
          # actualización venga de quien dice venir.
          #
          # Si se pierde la privada no se puede volver a actualizar a quien ya
          # tenga la app instalada; tendría que reinstalar a mano.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Para firmar en el futuro basta con añadir aquí los secretos:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (macOS)
          #   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD  (Windows)
          # No hace falta tocar el resto del workflow.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LibreType ${{ github.ref_name }}'
          releaseBody: |
            Binarios sin firmar. En macOS puede hacer falta abrir con clic
            derecho la primera vez; en Windows, aceptar el aviso de SmartScreen.
          # Sale en borrador y el actualizador apunta a `releases/latest`, que
          # ignora los borradores. Es lo que se quiere: nadie recibe una
          # actualización hasta que la release se publica a mano.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
