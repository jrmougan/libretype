[package]
name = "app"
version = "0.2.1"
description = "Tutor de mecanografia multiplataforma, visual y accesible"
authors = ["Jesus Romeo"]
license = "MIT"
repository = "https://github.com/jrmougan/libretype"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }

# El actualizador solo existe en escritorio: en móvil actualiza la tienda, no
# la app. Se declaran aparte para no arrastrar reqwest ni zip a un build de
# Android, donde además no compilarían.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
