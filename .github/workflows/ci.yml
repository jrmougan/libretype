name: CI

on:
  push:
    branches: [master]
  pull_request:

# Un push nuevo cancela el run anterior de la misma rama: no tiene sentido
# terminar de verificar un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, tests y compilación
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias del sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Lint y tipos
        run: pnpm lint

      - name: Tests con cobertura
        run: pnpm test:coverage

      - name: Bundle del frontend
        run: pnpm build

      - name: Formato Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Backend Rust
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

  repo-apt:
    name: Repositorio apt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Monta el repositorio con .deb sintéticos y lo ataca con un apt de
      # verdad: instala, actualiza, y comprueba que un índice o una firma
      # manipulados se rechazan. Sin esto, que el repositorio esté roto solo se
      # notaría cuando alguien intentase instalar desde él, que es tarde.
      #
      # Son .deb de mentira a propósito: aquí se prueba la maquinaria del
      # repositorio, no la compilación de la app. Eso mantiene el job en menos
      # de un minuto y permite que corra siempre.
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils dpkg-dev gnupg python3 curl

      - name: Probar el repositorio de punta a punta
        run: bash empaquetado/apt/probar-repo.sh

  spike-deadkeys:
    name: Dead keys en WebKitGTK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Compara WebKitGTK contra un GtkTextView nativo escribiendo tildes.
      # Es la comprobación de Linux que no se puede hacer desde un Mac: si el
      # motor web deja de componer los acentos como el campo de texto nativo,
      # esto falla y nos enteramos el mismo día.
      #
      # Lo que NO cubre: teclado físico real, IBus (el runner usa
      # gtk-im-context-simple) y la fidelidad de `code`. Ver
      # spike-deadkeys/linux/README.md.
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 xvfb

      - name: Ejecutar el spike
        run: bash spike-deadkeys/linux/run.sh
